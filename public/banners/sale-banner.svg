<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#6d1463"/>
      <stop offset=".45" stop-color="#9f2089"/>
      <stop offset="1" stop-color="#7a1470"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1a86"/>
      <stop offset="1" stop-color="#5a0d53"/>
    </linearGradient>
    <radialGradient id="shine" cx=".78" cy="1.2" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#ff6bd6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffd76a"/>
    </pattern>
    <pattern id="rays" width="40" height="110" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <rect width="20" height="110" fill="#ffc56b"/>
    </pattern>
  </defs>

  <rect width="1000" height="110" fill="url(#bg)"/>
  <rect width="1000" height="110" fill="url(#shine)"/>

  <path d="M0 0H215L185 110H0Z" fill="#ffb347"/>
  <path d="M0 0H215L185 110H0Z" fill="url(#rays)" opacity=".7"/>

  <g transform="translate(100 55) rotate(-5)">
    <rect x="-72" y="-40" width="144" height="80" rx="16" fill="url(#badge)" stroke="#ffd76a" stroke-width="4"/>
    <text y="-16" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#ffe9a8">MEGA</text>
    <rect x="-66" y="-8" width="132" height="24" rx="5" fill="#ff3f8e"/>
    <text y="10" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#fff">BLOCKBUSTER</text>
    <text y="34" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="17" fill="#ffe9a8">SALE</text>
  </g>

  <text x="500" y="72" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="2" fill="#fff4fb" filter="url(#glow)">SALE IS LIVE</text>

  <g transform="translate(775 55) rotate(-14)">
    <path d="M-22 -10 L6 -24 L6 24 L-22 10 Z" fill="#e8322f"/>
    <rect x="-34" y="-12" width="14" height="24" rx="4" fill="#f4f4f4"/>
    <ellipse cx="8" cy="0" rx="6" ry="25" fill="#c21f1c"/>
    <path d="M-28 12 L-22 30" stroke="#f4f4f4" stroke-width="6" stroke-linecap="round"/>
  </g>

  <rect x="826" y="31" width="154" height="48" rx="24" fill="#b37a00"/>
  <rect x="826" y="27" width="154" height="48" rx="24" fill="url(#btn)"/>
  <text x="903" y="58" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#4a0a43">SHOP NOW</text>

  <rect y="4" width="1000" height="8" fill="url(#dots)" opacity=".85"/>
  <rect y="98" width="1000" height="8" fill="url(#dots)" opacity=".85"/>
</svg>
